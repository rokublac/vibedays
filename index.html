<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>vibedays - music for your vibe</title>
    <meta name="description" content="vibedays plays music that fits your day. It checks the sun and the weather where you are, then finds music to match and changes it as the day goes on. No account needed." />
    <meta name="author" content="RB" />
    <link rel="canonical" href="https://vibedays.dewan-kimba.workers.dev/" />

    <!-- Matches the darkest gradient, so mobile browser chrome blends in. -->
    <meta name="theme-color" content="#05050c" />
    <meta name="color-scheme" content="dark light" />

    <!-- Files live in public/ and are served from the site root. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Uncomment once public/favicon.ico exists; a missing file is a 404 on every load.
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibedays" />
    <meta property="og:title" content="vibedays - music for your vibe" />
    <meta property="og:description" content="Music that fits your day. It reads the sun and the weather where you are, then finds a playlist to match." />
    <meta property="og:url" content="https://vibedays.dewan-kimba.workers.dev/" />
    <!-- Uncomment once public/og-image.png exists (1200x630). A tag pointing at
         a missing file renders worse than having no image at all.
    <meta property="og:image" content="https://vibedays.dewan-kimba.workers.dev/og-image.png" />
    <meta property="og:image:alt" content="vibedays, a player that matches music to your local weather and time of day." />
    -->

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="vibedays - music for your vibe" />
    <meta name="twitter:description" content="Music that fits your day. It reads the sun and the weather where you are, then finds a playlist to match." />

    <!-- Inlined deliberately: this is the only CSS that has to be right on the
         first paint. The main stylesheet is injected by JS in dev, a frame or
         two after the HTML renders, which flashed unstyled text in the corner.
         Kept self-contained; nothing here reads a custom property. -->
    <style>
      body { margin: 0; background: #08080c; }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 20;
        background: linear-gradient(180deg, #15151d 0%, #08080c 100%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* Fades out rather than vanishing, so the hero does not snap in. */
        transition: opacity 0.4s ease;
      }
      #boot.is-done { opacity: 0; pointer-events: none; }

      /* Hidden until the loader is done, then the two cross-fade. */
      #boot:not(.is-done) ~ #app,
      #boot:not(.is-done) ~ #brand { opacity: 0; pointer-events: none; }
      #app, #brand { transition: opacity 0.4s ease; }

      .boot-text {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        margin: 0;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: rgba(245, 245, 245, 0.85);
      }

      /* Three dots fading in sequence, slow enough not to compete with the
         rainbow sweep beside them. */
      .boot-dots { display: inline-flex; align-items: center; gap: 3px; }
      .boot-dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        animation: hb-dot 1.4s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: 0.18s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes hb-dot { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

      /* Same treatment as the login card wordmark; repeated here so the loader
         needs no external stylesheet. */
      #boot .rainbow {
        background-image: linear-gradient(
          90deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #b892ff, #ff6b6b
        );
        background-size: 200% auto;
        animation: hb-rainbow 6s linear infinite;
      }
      @supports (background-clip: text) or (-webkit-background-clip: text) {
        #boot .rainbow {
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
      }
      @keyframes hb-rainbow { to { background-position: 200% center; } }

      @media (prefers-reduced-motion: reduce) {
        #boot, #app, #brand { transition: none; }
        .boot-dots i { animation: none; opacity: 0.6; }
        #boot .rainbow { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="backdrop" data-particles="motes"></div>
    <!-- Shown until the first render. Geolocation and the weather call take a
         moment on a cold load, and before this the page was simply blank. -->
    <div id="boot" role="status">
      <p class="boot-text">
        loading <span class="rainbow">vibedays</span><span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </p>
    </div>
    <main id="app">
      <section id="controls"></section>
      <section id="player"></section>
      <section id="diagnostics"></section>
    </main>
    <div id="brand"><span class="rainbow">vibedays</span></div>
    <div id="modal" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
